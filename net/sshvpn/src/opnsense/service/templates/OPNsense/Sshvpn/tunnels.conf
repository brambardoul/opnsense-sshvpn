# Automatically generated by the OPNsense SSH VPN plugin. Do not edit.
# mode|unit|server_ip|client_ip|netmask|mtu|server_ip6|client_ip6|prefix6|description
{% if helpers.exists('OPNsense.sshvpn.general.enabled') and OPNsense.sshvpn.general.enabled == '1' %}
{%   for client in helpers.toList('OPNsense.sshvpn.clients.client') %}
{%     if client.enabled == '1' %}
{{ client.mode }}|{{ client.unit }}|{{ client.server_ip }}|{{ client.client_ip }}|{{ client.netmask }}|{{ client.mtu }}|{{ client.server_ip6|default('') }}|{{ client.client_ip6|default('') }}|{{ client.prefix6 }}|{{ client.description }}
{%     endif %}
{%   endfor %}
{% endif %}
