#
# Automatically generated by the OPNsense SSH VPN plugin. Do not edit.
#
# Included at the top of the core sshd_config. The Match block below is
# scoped to this file, so it only changes behaviour for user root:
#  - allow tun/tap forwarding (NetworkManager-ssh)
#  - additionally read VPN client keys from /usr/local/etc/sshvpn/keys/root;
#    every key there is restricted to a forced command and one tun/tap unit
#
{% if helpers.exists('OPNsense.sshvpn.general.enabled') and OPNsense.sshvpn.general.enabled == '1' %}
Match User root
	PermitTunnel yes
	AuthorizedKeysFile .ssh/authorized_keys .ssh/authorized_keys2 /usr/local/etc/sshvpn/keys/%u
{%   if not helpers.exists('system.ssh.permitrootlogin') and OPNsense.sshvpn.general.rootlogin|default('1') == '1' %}
	# root login is disabled under System: Settings: Administration;
	# still allow keys that carry a forced command (the VPN keys)
	PermitRootLogin forced-commands-only
{%   endif %}
{% endif %}
