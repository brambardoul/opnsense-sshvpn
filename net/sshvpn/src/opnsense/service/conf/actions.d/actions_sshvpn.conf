[reconfigure]
command:/usr/local/opnsense/scripts/sshvpn/reconfigure.sh
parameters:
type:script
message:reconfiguring SSH VPN

[setup]
command:/usr/local/opnsense/scripts/sshvpn/tunconf.py setup
parameters:
type:script
message:creating SSH VPN interfaces

[sessions]
command:/usr/local/opnsense/scripts/sshvpn/tunconf.py status
parameters:
type:script_output
message:requesting SSH VPN tunnel status

[fingerprints]
command:/bin/sh -c 'for f in /conf/sshd/ssh_host_*_key.pub; do /usr/local/bin/ssh-keygen -l -f "$f"; done'
parameters:
type:script_output
message:requesting SSH host key fingerprints

[rootkeys]
command:/usr/local/opnsense/scripts/sshvpn/rootkeys.py
parameters:
type:script_output
message:listing root authorized keys

[tunup]
command:/usr/local/opnsense/scripts/sshvpn/tunconf.py up
parameters:%s
type:script
message:configuring SSH VPN interface %s
