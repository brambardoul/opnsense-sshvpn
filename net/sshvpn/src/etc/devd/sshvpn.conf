# SSH VPN plugin: re-apply addresses when sshd opens a tun/tap device.
# Needed for clients that use NetworkManager-ssh's "no remote command" (-N)
# option, in which case the forced command never runs.
notify 100 {
	match "system"		"IFNET";
	match "subsystem"	"(tun|tap)[0-9]+";
	match "type"		"LINK_UP";
	action "/usr/local/opnsense/scripts/sshvpn/tunconf.py up $subsystem";
};
